[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anyblok-fastapi"
version = "0.2.0"
description = "AnyBlok with FastAPI"
readme = "README.rst"
license = "Apache-2.0"
authors = [
  { name = "Pierre Verkest", email = "pierre@verkest.fr" },
]
url = "https://github.com/AnyBlok/AnyBlok_FastAPI"
dependencies = [
    "anyblok",
    "anyblok-starlette>=0.1.0",
    "fastapi",
    "sqlalchemy",
    "uvicorn[standard]",
]

[project.entry-points.test_bloks]
test-fastapi-blok1="anyblok_fastapi.test_bloks.test_blok1:TestBlok"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "httpx2",
  "httpx>=0.28.1",
  "pytest-asyncio",
  "WebTest",
  "sphinx",
  "sphinxcontrib-httpdomain",
  "psycopg[binary]",
  "ruff",
  "pre-commit",
  "mypy",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "httpx2",
  "httpx>=0.28.1",
  "pytest-asyncio",
  "WebTest",
  "sphinx",
  "sphinxcontrib-httpdomain",
  "psycopg[binary]",
  "ruff",
  "pre-commit",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["anyblok_fastapi"]

[tool.pytest.ini_options]
testpaths = ["anyblok_fastapi/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -W error --cov=anyblok_fastapi --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "anyblok_fastapi/test_bloks/*",
  "conftest.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
